name: V5.4 acceptance contract

on:
  pull_request:
    paths:
      - config/v5.4-test-plan-contract.json
      - config/v5.4-test-plan-contract.schema.json
      - docs/a1-a4-complete-dataset-test-matrix.md
      - docs/a1-a4-metrics-and-pricing-formulas.md
      - tests/test_v54_test_plan_contract.py
      - .github/workflows/v54-contract-ci.yml
  push:
    branches: [main]
    paths:
      - config/v5.4-test-plan-contract.json
      - config/v5.4-test-plan-contract.schema.json
      - docs/a1-a4-complete-dataset-test-matrix.md
      - docs/a1-a4-metrics-and-pricing-formulas.md
      - tests/test_v54_test_plan_contract.py
      - .github/workflows/v54-contract-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install jsonschema pytest
      - run: python -m pytest -q tests/test_v54_test_plan_contract.py
