name: Extension catalog

on:
  pull_request:
    paths:
      - config/extension-catalog-v1.json
      - scripts/generate_extension_catalog.py
      - tests/test_extension_catalog.py
      - .github/workflows/extension-catalog-ci.yml
  push:
    branches: [main]
    paths:
      - config/extension-catalog-v1.json
      - scripts/generate_extension_catalog.py
      - tests/test_extension_catalog.py
      - .github/workflows/extension-catalog-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_extension_catalog.py
